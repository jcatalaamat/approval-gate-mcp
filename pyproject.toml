[project]
name = "approval-gate-mcp"
version = "0.1.0"
description = "A small MCP server: on-demand tool discovery, tenant isolation by construction, and a propose/confirm gate for irreversible actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp<2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_gate_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
